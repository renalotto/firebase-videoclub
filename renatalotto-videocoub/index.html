
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma de películas</title>
</head>

<body>

    <div class="form">
        <h1>Agregar película nueva</h1>
        <input type="text" id="titulo" placeholder="Título de la película" />
        <input type="text" id="director" placeholder="Director" />
        <input type="number" id="anio" placeholder="Año de estreno" />
        <input type="text" id="genero" placeholder="Género" />
        <input type="text" id="descripcion" placeholder="Descripción" />
        <button id="agregar">Agregar película</button>
    </div>

    <h2>Buscar película</h2>

    <input type="text" id="buscar" placeholder="Ingresa el título" />

    <button id="btnbuscar">Buscar</button>

    <p></p>

    <script src="db.js" type="module"></script>

</body>

</html>
